# Example GitHub Actions workflow for a project using cmake-dep.
#
# Caches only the archive store (~/.cache/cmake-dep/archives): it is smaller
# than the extracted trees, and cmake-dep rebuilds the trees from it offline.
# The key changes whenever the packages file (the pinned hashes) changes.

name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Same path on every OS keeps the cache step simple.
      CMDEP_DIR: ${{ github.workspace }}/../cmake-dep-cache
      # Optional: read from the team mirror first, then upstream.
      # CMDEP_MIRRORS: https://cmdep.example.com,direct
    steps:
      - uses: actions/checkout@v4

      - name: Restore cmake-dep archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../cmake-dep-cache/archives
          key: cmake-dep-${{ runner.os }}-${{ hashFiles('cmdep.lock', 'cmdep-packages.cmake') }}
          restore-keys: cmake-dep-${{ runner.os }}-

      - name: Lockfile is up to date
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/jorgen/cmake-dep.git "$RUNNER_TEMP/cmake-dep"
          "$RUNNER_TEMP/cmake-dep/bin/cmdep" lock --check

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMDEP_LOCKED=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
