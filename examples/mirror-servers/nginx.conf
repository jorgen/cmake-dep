# nginx site for a cmake-dep mirror.
#   - anyone on the LAN can read (GET/HEAD)
#   - PUT (write-back from CMDEP_MIRROR_PUSH / CmDepMirror.cmake) requires a password
#
# Requires the http_dav_module (included in the standard Debian/Ubuntu/Fedora
# nginx packages). Create the password file with:
#   htpasswd -c /etc/nginx/cmake-dep.htpasswd ci-bot
#
# Clients then use:
#   CMDEP_MIRRORS=http://cmdep.lan.example.com,direct
#   CMDEP_MIRROR_PUSH=http://cmdep.lan.example.com          # writers only
#   ~/.netrc: machine cmdep.lan.example.com login ci-bot password <pw>

server {
    listen 80;
    server_name cmdep.lan.example.com;

    root /srv/cmake-dep-mirror;

    location / {
        autoindex on;                   # browsable, handy for debugging

        dav_methods PUT;                # nginx writes to a temp file and renames: atomic
        create_full_put_path on;        # creates sha256/ on first upload
        dav_access user:rw group:r all:r;
        client_max_body_size 4g;        # Qt-sized archives
        client_body_temp_path /srv/cmake-dep-mirror/.upload-tmp;

        limit_except GET HEAD {
            auth_basic "cmake-dep mirror upload";
            auth_basic_user_file /etc/nginx/cmake-dep.htpasswd;
        }

        # Archives never change once written: the file name is the content hash.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
