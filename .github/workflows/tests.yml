name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: linux (CMake 3.18, minimum supported)
            os: ubuntu-22.04
            cmake: '3.18.6'
          - name: windows (MSVC)
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Use CMake ${{ matrix.cmake }}
        if: matrix.cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ matrix.cmake }}

      - name: MSVC environment (for Ninja builds of binary packages)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Tool versions
        run: |
          cmake --version
          ninja --version
          git --version

      - name: Run tests
        run: cmake -DWORK_DIR=${{ runner.temp }}/cmdep-tests -P tests/CmDepFetchTest.cmake

      # CmDepFetchGit pins `git archive --format=tar` output by hash, so it must be
      # byte-identical across git versions and platforms. Reference computed with
      # git 2.43 on Linux; this checks the runner's git (and core.autocrlf=true on
      # Windows) through cmake-dep's real code path.
      - name: git archive is deterministic across git versions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/det" && cd "$RUNNER_TEMP/det"
          CMDEP_DIR="$RUNNER_TEMP/det-cache" cmake -P "$GITHUB_WORKSPACE/cmake/CmDepCli.cmake" -- \
            add self 0 https://github.com/jorgen/cmake-dep.git --git 5d08e12a3986f2a738cdb7a204e7c154dfd128ee
          cat cmdep-packages.cmake
          grep -q "SHA256=1388138e83fd9bc6f4b548e254a37a0e952abb3698b0781730cddca06edb44b3" cmdep-packages.cmake

      - name: Upload test work directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-work-${{ matrix.os }}-${{ matrix.cmake || 'default' }}
          path: ${{ runner.temp }}/cmdep-tests
          retention-days: 7
